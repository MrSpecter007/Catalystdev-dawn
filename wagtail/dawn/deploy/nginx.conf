server {
    listen 80;
    server_name 187.127.252.86;

    client_max_body_size 64M;

    access_log /var/log/nginx/dawn_access.log;
    error_log  /var/log/nginx/dawn_error.log;

    location /static/ {
        alias /var/www/catalystdev-dawn/wagtail/dawn/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/catalystdev-dawn/wagtail/dawn/media/;
        expires 7d;
    }

    location / {
        proxy_pass         http://unix:/run/dawn/dawn.sock;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
