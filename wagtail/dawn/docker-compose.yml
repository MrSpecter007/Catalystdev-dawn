services:
  app:
    build: .
    container_name: catalystdev-app
    restart: unless-stopped
    environment:
      # Override wsgi.py's production default so Gunicorn uses dev settings
      DJANGO_SETTINGS_MODULE: dawn.settings.dev
    env_file:
      - path: .env.local
        required: false
    volumes:
      # Bind-mount source for live reload; media accessible via this mount too
      - .:/app
      # Separate volume so collectstatic output survives bind-mount overlay
      - staticfiles_vol:/app/staticfiles
    ports:
      # Direct access fallback (http://localhost:8000) — useful without Caddy
      - "8000:8000"
    networks:
      - catalystdev-local
      - default
    command: ["sh", "-c", "python manage.py collectstatic --noinput --clear && python manage.py migrate --noinput && gunicorn dawn.wsgi:application --bind 0.0.0.0:8000 --reload --workers 2 --timeout 120"]

volumes:
  staticfiles_vol:

networks:
  catalystdev-local:
    external: true
