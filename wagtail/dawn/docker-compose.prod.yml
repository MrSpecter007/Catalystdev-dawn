services:
  app:
    environment:
      DJANGO_SETTINGS_MODULE: dawn.settings.production
    volumes:
      # Don't bind-mount source in production; use the image layer
      - staticfiles_vol:/app/staticfiles
      - media_vol:/app/media
    ports: []
    command: >
      sh -c "python manage.py collectstatic --noinput --clear &&
             python manage.py migrate --noinput &&
             gunicorn dawn.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 120"

volumes:
  media_vol:
