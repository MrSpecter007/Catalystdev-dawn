{% extends "base/base.html" %}
{% load wagtailcore_tags %}

{% block content %}

<div class="wrapper">
	<div class="container">

		<h1>{{ page.heading }}</h1>
		{{ page.intro|richtext }}

		<form method="post">
			{% csrf_token %}

			{% for field in form %}
				<p>
					{{ field.label_tag }}<br>
					{{ field }}
					{{ field.errors }}
				</p>
			{% endfor %}

			<button type="submit">Send</button>
		</form>

	</div>
</div>

{% endblock %}
