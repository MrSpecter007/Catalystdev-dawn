{% extends "base/base.html" %}
{% load wagtailcore_tags %}
{% load static %}

{% block body_class %}template-portfoliopage{% endblock %}

{% block content %}
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date }}</p>

    <div class="intro">{{ page.intro }}</div>

    {{ page.body|richtext }}

    <p><a href="{{ page.get_parent.url }}">Return to portfolio</a></p>

{% endblock %}
